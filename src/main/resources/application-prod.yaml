spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    com.example.library: INFO
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: OFF

  file:
    name: logs/library.log

library:
  security:
    admin-password: ${ADMIN_PASSWORD:}
    reader-password: ${READER_PASSWORD:}
    jwt:
      secret: ${JWT_SECRET:}
      expiration: 1h