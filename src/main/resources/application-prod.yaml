spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false

logging:
  level:
    com.example.library: INFO
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: OFF

  file:
    name: logs/library.log